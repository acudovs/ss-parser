plugins {
    id 'com.google.cloud.tools.jib' version '3.5.1'
    id 'org.springframework.boot' version '3.5.14'
}

apply plugin: 'idea'
apply plugin: 'java'
apply plugin: 'io.spring.dependency-management'

version = '1.17'

def defaultJre = 25
def arch = project.findProperty('arch')
def jreByArch = ['arm': 17]
def jre = jreByArch.getOrDefault(arch, defaultJre)

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(defaultJre)
    }
}

tasks.withType(JavaCompile).configureEach {
    if (jre < defaultJre) options.release = jre
}

jib {
    from {
        image = "docker.io/library/eclipse-temurin:${jre}-jre"
        if (arch) {
            platforms {
                platform {
                    os = 'linux'
                    architecture = arch
                }
            }
        }
    }
    to {
        image = rootProject.name + ':' + version + (arch ? "-${arch}" : '')
    }
    container {
        creationTime = 'USE_CURRENT_TIMESTAMP'
        jvmFlags = [
                '-Dfile.encoding=UTF-8',
                '-Duser.timezone=Europe/Riga',
                '-Xms32m',
                '-Xmx32m',
                '-verbose:gc'
        ]
    }
}

idea {
    module {
        inheritOutputDirs = false
        outputDir = file 'build/classes/java/main'
        testOutputDir = file 'build/classes/test/main'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    compileOnly 'org.projectlombok:lombok'
    compileOnly 'org.springframework.boot:spring-boot-configuration-processor'
    compileOnly 'org.springframework.boot:spring-boot-loader'

    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.apache.commons:commons-lang3'
    implementation 'org.jsoup:jsoup:1.22.2'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

['car', 'flat-sell', 'flat-rent', 'home'].each { adType ->
    tasks.register("testRegex-${adType}", JavaExec) {
        dependsOn testClasses
        workingDir = projectDir
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'ss.parser.RssRegexTest'
        def regex = findProperty('regex')
        args = regex ? [adType, regex] : [adType]
    }
}

tasks.register('testRegex') {
    dependsOn tasks.matching { it.name.startsWith('testRegex-') }
}
